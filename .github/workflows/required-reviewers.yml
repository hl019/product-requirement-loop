name: Required reviewers (all must approve)

# 必审人在 PR 评论单独一行发 `/通过`（全员通过后门禁绿）。
# `/驳回` 可撤回或反对。作者自动排除；新 push 后须对当前 head 重新 `/通过`。
# 进度写在 PR 置顶 sticky 评论（同一条更新，不刷屏）。
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write
  statuses: write
  reactions: write

jobs:
  all-reviewers:
    runs-on: ubuntu-latest
    steps:
      - name: Verify every required reviewer posted /通过
        uses: actions/github-script@v7
        with:
          script: |
            const REQUIRED_ALL = ['hongwei-2026', 'hl019', 'Jerrybao99', 'likexin105'];
            const PASS = new Set(['通过', 'approve', 'lgtm', 'ack']);
            const FAIL = new Set(['驳回', 'reject', 'changes', 'deny']);
            const MARKER = '<!-- required-reviewers-progress -->';

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            let pull_number = context.payload.pull_request?.number || null;
            if (!pull_number && context.payload.issue?.pull_request) {
              pull_number = context.payload.issue.number;
            }
            if (!pull_number) {
              core.info('Not a pull request event — skip');
              return;
            }

            // 忽略 bot 对自己 sticky 的编辑，避免循环
            if (context.eventName === 'issue_comment') {
              const body = context.payload.comment?.body || '';
              if (body.includes(MARKER)) {
                core.info('Ignore sticky progress comment event');
                return;
              }
            }

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
            if (pr.state !== 'open') {
              core.info('PR not open — skip');
              return;
            }

            const headSha = pr.head.sha;
            const author = (pr.user?.login || '').toLowerCase();
            const REQUIRED = REQUIRED_ALL.filter(u => u.toLowerCase() !== author);
            if (REQUIRED.length < REQUIRED_ALL.length) {
              core.info(`Excluded PR author @${pr.user.login} (cannot self-pass).`);
            }
            if (!REQUIRED.length) {
              core.setFailed('No required reviewers left after excluding author.');
              return;
            }

            try {
              await github.rest.pulls.requestReviewers({
                owner, repo, pull_number, reviewers: REQUIRED
              });
            } catch (e) {
              core.warning(`requestReviewers skipped: ${e.status || e.message}`);
            }

            const { data: commit } = await github.rest.repos.getCommit({
              owner, repo, ref: headSha
            });
            const headTime = new Date(
              commit.commit.committer?.date || commit.commit.author?.date
            );

            const parseCmd = (body) => {
              const lines = (body || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean);
              for (const line of lines) {
                // 允许 /通过 或单独一行「通过」
                let m = line.match(/^\/(通过|驳回|approve|lgtm|ack|reject|changes|deny)\b/i);
                if (!m && /^(通过|驳回|approve|lgtm|ack|reject|changes|deny)$/i.test(line)) {
                  m = [line, line];
                }
                if (!m) continue;
                const key = m[1].toLowerCase();
                if (PASS.has(key)) return 'pass';
                if (FAIL.has(key)) return 'fail';
              }
              return null;
            };

            if (context.eventName === 'issue_comment') {
              const c = context.payload.comment;
              const actor = (c.user?.login || '').toLowerCase();
              const cmd = parseCmd(c.body);
              if (cmd) {
                if (actor === author) {
                  try {
                    await github.rest.issues.createComment({
                      owner, repo, issue_number: pull_number,
                      body: `⛔ @${c.user.login} 是本 PR 作者，不能给自己 \`/通过\`。请其余必审人评论。`
                    });
                  } catch (_) {}
                } else if (!REQUIRED_ALL.map(u => u.toLowerCase()).includes(actor)) {
                  try {
                    await github.rest.issues.createComment({
                      owner, repo, issue_number: pull_number,
                      body: `⛔ @${c.user.login} 不在必审名单，票不计入。`
                    });
                  } catch (_) {}
                } else {
                  try {
                    await github.rest.reactions.createForIssueComment({
                      owner, repo, comment_id: c.id, content: cmd === 'pass' ? '+1' : '-1'
                    });
                  } catch (_) {}
                }
              }
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pull_number, per_page: 100
            });

            const latest = new Map();
            for (const c of comments) {
              const login = c.user?.login;
              if (!login) continue;
              if ((c.body || '').includes(MARKER)) continue;
              if (login.endsWith('[bot]') || login === 'github-actions[bot]') continue;
              const cmd = parseCmd(c.body);
              if (!cmd) continue;
              const at = new Date(c.updated_at || c.created_at);
              // 允许 2s 时钟误差；新 push 之前的票仍作废
              if (at.getTime() + 2000 < headTime.getTime()) continue;
              const key = login.toLowerCase();
              const prev = latest.get(key);
              if (!prev || at >= prev.at) {
                latest.set(key, { state: cmd, at, user: login });
              }
            }

            // 本事件刚投的票若因分页延迟未进 list，直接合并进去
            if (context.eventName === 'issue_comment') {
              const c = context.payload.comment;
              const cmd = parseCmd(c.body);
              const actor = (c.user?.login || '').toLowerCase();
              if (cmd && REQUIRED.map(u => u.toLowerCase()).includes(actor) && actor !== author) {
                latest.set(actor, {
                  state: cmd,
                  at: new Date(c.updated_at || c.created_at),
                  user: c.user.login
                });
              }
            }

            const missing = [];
            const rejected = [];
            const passed = [];
            for (const need of REQUIRED) {
              const hit = latest.get(need.toLowerCase());
              if (!hit) { missing.push(need); continue; }
              if (hit.state !== 'pass') rejected.push(need);
              else passed.push(need);
            }

            const done = passed.length;
            const total = REQUIRED.length;
            const bar = '█'.repeat(done) + '░'.repeat(Math.max(0, total - done));

            const progressBody = [
              MARKER,
              '## 必审进度',
              '',
              `**${done} / ${total}** 已通过 \`${bar}\``,
              '',
              `Head: \`${headSha.slice(0, 7)}\``,
              author ? `已排除作者（不可自审）：@${pr.user.login}` : '',
              '',
              '| 必审人 | 状态 |',
              '|--------|------|',
              ...REQUIRED.map(u => {
                const hit = latest.get(u.toLowerCase());
                let st = '⏳ 待 `/通过`';
                if (hit?.state === 'pass') st = '✅ 已通过';
                if (hit?.state === 'fail') st = '❌ 已驳回';
                return `| @${u} | ${st} |`;
              }),
              '',
              '---',
              '在本 PR **评论单独一行**发送：`/通过` 或 `/驳回`',
              '同义：`/approve` `/lgtm` ≈ 通过；`/reject` `/changes` ≈ 驳回。',
              '**新 push 后旧票作废**，须重新 `/通过`。',
              '',
              '_本条由机器人维护，请勿手动编辑。_',
            ].filter(Boolean).join('\n');

            try {
              const prev = comments.find(c => (c.body || '').includes(MARKER));
              if (prev) {
                await github.rest.issues.updateComment({
                  owner, repo, comment_id: prev.id, body: progressBody
                });
              } else {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: pull_number, body: progressBody
                });
              }
            } catch (e) {
              core.warning(`Progress sticky skipped (${e.status || e.message})`);
            }

            await core.summary.addRaw(progressBody).write();

            if (missing.length || rejected.length) {
              const detail = [
                missing.length ? `未 /通过：${missing.map(u => '@' + u).join(', ')}` : '',
                rejected.length ? `已驳回：${rejected.map(u => '@' + u).join(', ')}` : '',
              ].filter(Boolean).join('；');
              core.setFailed(detail);
              return;
            }
            core.info('All required reviewers posted /通过 for current head.');
