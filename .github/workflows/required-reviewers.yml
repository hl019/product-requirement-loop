name: Required reviewers (all must approve)

# 强制：必审人全部 Approve 后本检查才绿。
# PR 作者若在名单内会被排除（GitHub 不允许自我 Approve）。
# pull_request_target：始终用 main 上的定义；可 requestReviewers。
# 状态写在 Check / Job Summary，不往 PR 时间线刷「必审人门禁」评论（合并区看卡片即可）。
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed, edited]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write
  statuses: write

jobs:
  all-reviewers:
    runs-on: ubuntu-latest
    steps:
      - name: Verify every required reviewer approved
        uses: actions/github-script@v7
        with:
          script: |
            const REQUIRED_ALL = ['hongwei-2026', 'hl019', 'Jerrybao99', 'likexin105'];
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number =
              context.payload.pull_request?.number ||
              context.payload.pull_request_review?.pull_request?.number;
            if (!pull_number) {
              core.setFailed('No pull request in event payload');
              return;
            }

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
            const headSha = pr.head.sha;
            const author = (pr.user?.login || '').toLowerCase();

            const REQUIRED = REQUIRED_ALL.filter(u => u.toLowerCase() !== author);
            if (REQUIRED.length < REQUIRED_ALL.length) {
              core.info(`Excluded PR author @${pr.user.login} (cannot self-approve).`);
            }
            if (!REQUIRED.length) {
              core.setFailed('No required reviewers left after excluding author — check REQUIRED list.');
              return;
            }

            // 让合并区出现「pending reviews」卡片（排除作者）
            try {
              await github.rest.pulls.requestReviewers({
                owner, repo, pull_number, reviewers: REQUIRED
              });
            } catch (e) {
              core.warning(`requestReviewers skipped: ${e.status || e.message}`);
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner, repo, pull_number, per_page: 100
            });
            const latest = new Map();
            for (const r of reviews) {
              const login = r.user?.login;
              if (!login) continue;
              latest.set(login.toLowerCase(), { state: r.state, user: login });
            }

            const missing = [];
            const bad = [];
            for (const need of REQUIRED) {
              const hit = latest.get(need.toLowerCase());
              if (!hit) { missing.push(need); continue; }
              if (hit.state !== 'APPROVED') bad.push(`${need}(${hit.state})`);
            }

            const summary = [
              '## 必审人门禁',
              '',
              `Head: \`${headSha.slice(0, 7)}\``,
              author ? `已排除作者：@${pr.user.login}` : '',
              '',
              '需要 Approve：',
              ...REQUIRED.map(u => {
                const hit = latest.get(u.toLowerCase());
                const st = hit ? hit.state : 'PENDING';
                return `- @${u} — **${st}**`;
              }),
            ].filter(Boolean).join('\n');
            await core.summary.addRaw(summary).write();

            if (missing.length || bad.length) {
              const detail = [
                missing.length ? `未 Approve：${missing.map(u => '@' + u).join(', ')}` : '',
                bad.length ? `非 APPROVED：${bad.join(', ')}` : '',
              ].filter(Boolean).join('；');
              core.setFailed(detail || 'Required reviewers have not all APPROVED yet.');
              return;
            }
            core.info('All required reviewers approved.');
